name: Montar painel 2025 (após SIA)

# Dispara quando o workflow "SIA - atendimento a vítima de violência sexual" termina com sucesso:
# baixa os artefatos (JSON por UF), monta a planilha 2025, prepara, audita, remonta o index.html
# e faz o commit na main (o GitHub Pages republica em seguida).
on:
  workflow_run:
    workflows: ["SIA - atendimento a vítima de violência sexual"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "id da execução do workflow SIA cujos artefatos usar"
        required: true

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  montar:
    # só monta sozinho quando o SIA tabulado é o de 2025 (o título da execução traz as competências); outros anos são extrações de conferência
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.display_title, '2501-2512')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - name: Baixar artefatos do SIA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id || github.event.workflow_run.id }}"
          mkdir -p extracao/saida/sia_pa_2025
          gh run download "$RUN_ID" -D /tmp/sia --pattern 'sia-*'
          find /tmp/sia -name '*.json' -exec mv {} extracao/saida/sia_pa_2025/ \;
          ls extracao/saida/sia_pa_2025 | wc -l
      - name: Montar planilha 2025, preparar, auditar e remontar o painel
        run: |
          set -eo pipefail
          python scripts/extracao/montar_planilha.py --ano 2025 --sinasc sinasc_2025.json --partos i2025 --amiu i2025 --cnes 2609 \
            --referencia planilhas/ESTABELECIMENTOS_ACIMA_DE_1000_PARTOS_2024__INDICADORES_01072026.xlsx \
            --sp extracao/saida/codigos_sp_2025.json --smcon extracao/smcon_2024.csv --sia extracao/saida/sia_pa_2025 \
            --saida planilhas/PLANILHA_2025_prelim_internacao.xlsx
          python scripts/01_preparar_dados.py planilhas/PLANILHA_2025_prelim_internacao.xlsx 2025 --preliminar --extracao "$(date +%d/%m/%Y)"
          python scripts/04_auditoria.py planilhas/PLANILHA_2025_prelim_internacao.xlsx 2025 | tee auditoria_2025.txt
          python scripts/03_montar_painel.py
      - name: Conferência do painel montado
        run: |
          python - <<'EOF'
          import json, re, sys
          h = open("index.html", encoding="utf-8").read()
          anos = json.loads(re.search(r"const DADOS_ANOS = (\{.*?\});\nconst ANO_CFG", h, re.S).group(1))
          cfg = json.loads(re.search(r"const ANO_CFG = (\{.*?\});\n", h).group(1))
          d25, d24 = anos["2025"], anos["2024"]
          sia = {}
          import glob
          for f in glob.glob("extracao/saida/sia_pa_2025/*.json"):
              sia.update(json.load(open(f, encoding="utf-8"))["estabelecimentos"])
          ufs = len({json.load(open(f, encoding="utf-8"))["uf"] for f in glob.glob("extracao/saida/sia_pa_2025/*.json")})  # SP vem em 4 partes
          viol = sum(1 for d in d25 if d["viol"]); selo = sum(1 for d in d25 if d["selo"])
          erros = []
          if ufs != 27: erros.append(f"SIA: {ufs} UFs tabuladas (esperado 27)")
          if len(d24) != 543: erros.append(f"2024 com {len(d24)} unidades")
          if not (540 <= len(d25) <= 570): erros.append(f"2025 com {len(d25)} unidades")
          if cfg["2025"].get("semEstagios"): erros.append("2025 ainda sem estágios")
          if cfg["2025"].get("indisponiveis"): erros.append(f"indisponíveis em 2025: {cfg['2025']['indisponiveis']}")
          if viol < 100: erros.append(f"só {viol} unidades com violência sexual adequada em 2025 (2024: 225)")  # 2024 usou outra fonte (ver METODOLOGIA 4.7); SIA conferido no TabNet dá ~139
          resumo = (f"2025: {len(d25)} unidades, {sum(d['tot'] for d in d25):,} partos; violência sexual adequada em {viol}; "
                    f"Avançando {selo}; SIA tabulado em {ufs} UFs ({sum(d['violN'] for d in d25):,} atendimentos).")
          open("conferencia.txt", "w", encoding="utf-8").write(resumo + ("\nERROS: " + "; ".join(erros) if erros else "\nConferência OK"))
          print(resumo); print("ERROS:", erros) if erros else print("Conferência OK")
          sys.exit(1 if erros else 0)
          EOF
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dados planilhas extracao/saida/sia_pa_2025
          git commit -m "2025 com atendimento a vítima de violência sexual (SIA) tabulado na nuvem; estágios de desempenho de 2025 calculados" || echo "nada a commitar"
          git push
      - name: Avisar (issue no repositório → e-mail do GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TIT="Painel 2025 publicado com violência sexual e estágios de desempenho"
          else
            TIT="FALHOU a montagem do painel 2025 na nuvem"
          fi
          {
            echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo; echo "## Auditoria"; cat auditoria_2025.txt 2>/dev/null || echo "(não rodou)"
            echo; echo "## Conferência"; cat conferencia.txt 2>/dev/null || echo "(não rodou)"
            echo; echo "Painel: https://anamazza.github.io/Indicadores_partos_Brasil2024/ (o GitHub Pages republica 1–2 min após o commit)."
          } > corpo.md
          gh issue create --title "$TIT" --body-file corpo.md
