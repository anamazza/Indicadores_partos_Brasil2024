name: SIA - atendimento a vítima de violência sexual
run-name: "SIA violência ${{ inputs.ini }}-${{ inputs.fim }}"

# Baixa os arquivos PA do SIA/SUS (FTP do DATASUS) na nuvem, em grupos de UF em paralelo (São Paulo
# dividido por trimestre), e tabula os procedimentos 0301040052 e 0301040060 por CNES
# (scripts/extracao/sia_violencia.py). Resultado: artefatos sia-<n> com um JSON por UF/período,
# somados na montagem (extracao/saida/sia_pa_<ano>/).
on:
  workflow_dispatch:
    inputs:
      ini:
        description: "competência inicial (aamm)"
        default: "2501"
      fim:
        description: "competência final (aamm)"
        default: "2512"
      apenas:
        description: "só estes grupos da matriz (separados por vírgula, ex.: SP|2501|2503,RS BA MT||); vazio = todos"
        default: ""

jobs:
  tabular:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # "UFs|mês inicial|mês final" — meses vazios usam os inputs do workflow; com meses, o ano é o do input ini
        grupo:
          - "SP|01|03"
          - "SP|04|06"
          - "SP|07|09"
          - "SP|10|12"
          - "MG ES||"
          - "RJ DF||"
          - "PR SC MS||"
          - "RS||"
          - "BA MT||"
          - "PE CE GO PB||"
          - "MA PA AM PI||"
          - "RN RO SE AL TO AP RR AC||"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install datasus-dbc
      - name: Baixar e tabular
        if: ${{ inputs.apenas == '' || contains(inputs.apenas, matrix.grupo) }}
        env:
          APAGAR_DBC: "1"
        run: |
          IFS='|' read -r UFS M1 M2 <<< "${{ matrix.grupo }}"
          AA="${{ inputs.ini }}"; AA="${AA:0:2}"
          INI="${{ inputs.ini }}"; FIM="${{ inputs.fim }}"
          if [ -n "$M1" ]; then INI="${AA}${M1}"; FIM="${AA}${M2}"; fi
          if [ "$INI$FIM" != "${{ inputs.ini }}${{ inputs.fim }}" ]; then export SUFIXO_SAIDA="_${INI}_${FIM}"; fi
          echo "UFs: $UFS | competências $INI-$FIM | sufixo: ${SUFIXO_SAIDA:-}"
          python scripts/extracao/sia_violencia.py /tmp/pa "$INI" "$FIM" saida_sia $UFS
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.apenas == '' || contains(inputs.apenas, matrix.grupo) }}
        with:
          name: sia-${{ strategy.job-index }}
          path: saida_sia/*.json
          if-no-files-found: error
